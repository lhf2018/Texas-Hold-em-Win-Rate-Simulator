<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a2a1a"><title>德扑模拟 · 你的牌桌，你的判断</title>
<link rel="stylesheet" href="/static/game.css">
</head>
<body>
<main class="container">
<header class="header"><div><h1>德扑模拟 <span>♠</span></h1></div></header>
<div class="toolbar"><div class="table-info"><span>单次加注练习桌</span><span id="tableSize">4 人局</span><span>盲注 10 / 20</span><span id="startingStack">起始筹码 1,000</span></div><button id="restart" class="text-btn">↻ 重新开桌</button></div>
<div class="layout">
<section class="main-card">
<div class="table-top"><span id="handLabel">准备入座</span><span id="stageLabel" class="pill">等待发牌</span><span id="turnLabel">筹码单位：点</span></div>
<div class="table-scene">
<div class="felt">

<div class="board-area"><div class="pot-label">底池 <strong id="pot">0</strong></div><div id="board" class="cards-row board"></div><div id="tableMessage" class="table-message" hidden></div></div>
</div>
<div id="tableBets" class="table-bets" aria-label="玩家本手投入筹码"></div>
<div id="opponents" class="opponents"></div>
<div class="player-dock">
<div id="hero" class="hero"></div>
<section class="action-area" aria-label="行动控制">
<div class="action-heading"><div><h2 id="actionTitle">准备开始</h2></div><span id="callHint" class="muted"></span></div>
<div id="actions" class="actions" hidden><button id="fold" class="btn secondary">弃牌</button><button id="call" class="btn primary">过牌</button><button id="raise" class="btn gold-outline">加注</button></div>
<div id="raiseControls" class="raise-controls" hidden><label for="raiseAmount">本轮加注到</label><input id="raiseAmount" type="number" step="1" min="20" aria-label="本轮加注到"><button id="halfPot" class="chip-btn">½ 底池</button><button id="potRaise" class="chip-btn">底池</button><button id="allin" class="chip-btn">全下</button><span id="raiseHint" class="muted"></span></div>
<button id="deal" class="btn primary deal">入座并开始 →</button>
<p id="error" class="error" role="alert" hidden></p>
</section>
</div>
<div id="result" class="result" hidden></div>
</div>
</section>
<aside>
<section class="panel analysis-panel"><div class="panel-heading"><div><h2>实时胜率分析</h2></div><label class="switch" title="开启或关闭实时分析"><input id="analysisToggle" type="checkbox" role="switch" aria-label="实时胜率分析"><span></span></label></div>

<div id="analysisOff" class="analysis-placeholder"><p>分析已关闭</p></div>
<div id="analysisContent" hidden><div id="analysisStatus" class="analysis-status" aria-live="polite">等待你的回合</div><div id="analysisData" hidden><div class="equity-block"><span>预计底池权益</span><strong id="equity">--<small>%</small></strong><div class="progress"><i id="equityBar"></i></div></div><div class="metrics"><div><span>独赢概率</span><b id="winRate">--</b></div><div><span>平局概率</span><b id="tieRate">--</b></div><div><span>跟注 EV</span><b id="ev">--</b></div><div><span>跟注门槛</span><b id="potOdds">--</b></div></div><div id="handStrength" class="hand-strength"></div><p id="suggestion" class="advice"></p><div id="draws" class="draws"></div><div id="ranges" class="ranges"></div><details><summary>计算说明</summary><p id="assumption"></p><p>底池权益包含多人平分；成牌不等于获胜。2,500 次抽样存在统计波动；下注只能帮助推测，不能确定底牌。</p></details></div></div>
</section>
<section class="panel history-panel"><div class="panel-heading"><h2>本手记录</h2></div><ol id="history" class="history"><li class="muted">暂无记录</li></ol></section>
</aside>
</div>

</main>
<dialog id="restartDialog"><h2>开桌设置</h2>
<form id="tableSettings">
<label for="playerCount">牌桌人数</label><select id="playerCount"><option value="2">2 人局 · 单挑</option><option value="3">3 人局</option><option value="4" selected>4 人局</option><option value="5">5 人局</option><option value="6">6 人局</option><option value="7">7 人局</option><option value="8">8 人局</option><option value="9">9 人局</option><option value="10">10 人局</option></select>
<label for="startingChips">每人起始筹码</label><input id="startingChips" type="number" min="100" max="100000" step="1" value="1000" required>
<div class="stack-presets"><button type="button" data-stack="500">500</button><button type="button" data-stack="1000">1,000</button><button type="button" data-stack="2000">2,000</button><button type="button" data-stack="5000">5,000</button></div>
<p>盲注 10 / 20。重新开桌将重置当前牌局。</p>
<div class="dialog-actions"><button type="button" id="cancelRestart" class="btn secondary">取消</button><button type="submit" id="confirmRestart" class="btn primary">开始游戏</button></div>
</form></dialog>
<script src="/static/game.js"></script>
</body></html>
